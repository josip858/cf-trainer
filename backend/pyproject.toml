[project]
name="cf-trainer-backend"
version ="0.1.0"
dependencies = ["fastapi[standard]","pydantic"]

[project.optional-dependencies]
dev = ["pytest","pytest-asyncio"]

[tool.pytest.ini_options]
pythonpath=["."]
asyncio_mode="auto"
markers= ["slow:tests that call web"]

[tool.setuptools]
py-modules=["main","cf_client","schemas"]


